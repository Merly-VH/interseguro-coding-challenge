<div class="qr-calculator">
  @if (authService.configChecked() && !authService.hasConfiguredKey()) {
    <mat-card appearance="outlined" class="qr-calculator__card">
      <mat-card-header>
        <mat-card-title>Autenticación</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline" class="qr-calculator__api-key">
          <mat-label>API key</mat-label>
          <input
            matInput
            [type]="apiKeyVisible() ? 'text' : 'password'"
            (input)="onApiKeyChange($any($event.target).value)"
            autocomplete="off"
            placeholder="Pegá acá tu API key"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="toggleApiKeyVisibility()"
            [attr.aria-label]="apiKeyVisible() ? 'Ocultar API key' : 'Mostrar API key'"
          >
            <mat-icon>{{ apiKeyVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>
            Solo necesaria en desarrollo local. En el despliegue con Docker se configura sola.
          </mat-hint>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  }

  <mat-card appearance="outlined" class="qr-calculator__card">
    <mat-card-header>
      <mat-card-title>Matriz de entrada</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-matrix-input #matrixInput (matrixChange)="onMatrixChange($event)" />
    </mat-card-content>
    <mat-card-actions class="qr-calculator__actions">
      <button mat-stroked-button type="button" (click)="matrixInput.clear(); clearResults()">
        <mat-icon>delete</mat-icon>
        Limpiar
      </button>
      <button mat-flat-button color="primary" (click)="calculate()" [disabled]="loading()">
        @if (loading()) {
          <mat-progress-spinner diameter="20" mode="indeterminate" />
        } @else {
          <mat-icon>calculate</mat-icon>
        }
        Calcular QR
      </button>
    </mat-card-actions>
  </mat-card>

  @if (errorMessage()) {
    <mat-card appearance="outlined" class="qr-calculator__error" role="alert">
      <mat-card-content>
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage() }}</span>
      </mat-card-content>
    </mat-card>
  }

  @if (result(); as res) {
    <div class="qr-calculator__results">
      <app-matrix-view label="Q" [matrix]="res.q" />
      <app-matrix-view label="R" [matrix]="res.r" />
      <app-stats-view [stats]="res.stats" />
    </div>
  }
</div>
