services:
  node-stats-api:
    build: ./node-stats-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - challenge-net

  go-qr-api:
    build: ./go-qr-api
    ports:
      - "8080:8080"
    environment:
      STATS_API_URL: http://node-stats-api:3000
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      API_KEY: ${API_KEY:?falta API_KEY en .env}
    depends_on:
      node-stats-api:
        condition: service_healthy
    networks:
      - challenge-net

networks:
  challenge-net:
    driver: bridge
